<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Media Saver">
<title>Media Saver</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <span>Media Saver</span>
    </div>
    <button id="historyBtn" class="icon-btn" aria-label="Recent downloads">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>
    </button>
  </header>

  <main>
    <form id="form" class="finder" autocomplete="off">
      <label class="sr-only" for="url">Media URL</label>
      <div class="field">
        <input id="url" name="url" type="url" inputmode="url" enterkeyhint="go" spellcheck="false"
               placeholder="Paste a link to a post or video">
        <button type="button" id="clearBtn" class="clear" aria-label="Clear" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="actions">
        <button type="button" id="pasteBtn" class="ghost">Paste</button>
        <button type="submit" id="findBtn" class="primary">
          <span class="btn-label">Find media</span>
          <span class="spinner" hidden></span>
        </button>
      </div>
    </form>

    <p id="hint" class="hint">Works with most video and social platforms. The file is saved straight to your browser's Downloads.</p>

    <div id="alert" class="alert" hidden></div>

    <section id="result" class="card" hidden>
      <div class="preview">
        <div class="thumb-wrap">
          <img id="thumb" class="thumb" alt="" hidden>
          <div id="thumbFallback" class="thumb thumb-fallback">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 9 5 3-5 3z"/><rect x="3" y="4" width="18" height="16" rx="3"/></svg>
          </div>
          <span id="duration" class="duration" hidden></span>
        </div>
        <div class="meta">
          <h2 id="title"></h2>
          <p id="uploader"></p>
          <span id="source" class="badge" hidden></span>
        </div>
      </div>

      <div id="options" class="options"></div>
      <button type="button" id="moreBtn" class="text-btn" hidden>Show all formats</button>
      <div id="allFormats" class="options all-formats" hidden></div>
    </section>

    <section id="playlist" class="card" hidden>
      <h2 id="plTitle"></h2>
      <p id="plMeta" class="muted"></p>
      <div id="plEntries" class="entries"></div>
    </section>

    <section id="jobs" class="jobs"></section>
  </main>

  <div id="historyPanel" class="sheet" hidden>
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2>Recent</h2>
        <button type="button" id="closeHistory" class="icon-btn" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div id="historyList" class="entries"></div>
      <button type="button" id="clearHistory" class="text-btn danger">Clear history</button>
    </div>
  </div>

  <footer id="footer" class="footer">
    <span id="envInfo"></span>
  </footer>
</div>
<script src="/app.js"></script>
</body>
</html>
